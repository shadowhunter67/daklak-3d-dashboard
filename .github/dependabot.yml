version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      three-stack:
        patterns:
          - three
          - '@types/three'
          - '@react-three/fiber'
          - '@react-three/drei'
      playwright-and-testing:
        patterns:
          - '@playwright/test'
          - '@axe-core/playwright'
          - '@testing-library/*'
          - vitest
          - jsdom
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    open-pull-requests-limit: 6
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # codeql-action/init and codeql-action/analyze must move in lockstep — a PR
      # bumping only one fails with "Loaded a configuration file for version X, but
      # running version Y". Group every action bump into a single PR.
      github-actions:
        patterns:
          - '*'
    open-pull-requests-limit: 5
